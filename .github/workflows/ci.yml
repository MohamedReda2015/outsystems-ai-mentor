name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["16", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Skill consistency (frontmatter, links, rule IDs, adapters, hygiene)
        run: node scripts/check_skill.mjs

      - name: Script regression tests
        run: node scripts/test.mjs

      - name: Good example state is clean
        run: |
          node scripts/check-workflow.mjs scripts/examples/good-state.json

      - name: Evals file is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('evals/evals.json','utf8'))"

      - name: Package the skill (smoke test)
        run: |
          git archive --format=zip --prefix=outsystems-ai-mentor/ -o outsystems-ai-mentor.zip HEAD
          unzip -l outsystems-ai-mentor.zip | grep -q "outsystems-ai-mentor/SKILL.md"
          ! unzip -l outsystems-ai-mentor.zip | grep -q "\.github/"
